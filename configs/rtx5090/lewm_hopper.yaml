env:
  id: Hopper-v5
  seed: 0
  render_size: 96
  success_return_threshold: null
collect:
  transitions: 30000
lewm:
  latent_dim: 192
  hidden_dim: 512
  sigreg_lambda: 0.001
  sigreg_projections: 512
  sigreg_knots: 17
  batch_size: 256
  epochs: 40
  lr: 0.0003
  encoder: vit
  predictor: ar_transformer
  patch_size: 16
  encoder_depth: 6
  encoder_heads: 3
  predictor_depth: 4
  predictor_heads: 3
  history: 2
  sigreg_scale_by_n: true
reward_probe:
  epochs: 20
  lr: 0.001
mpc:
  horizon: 8
  candidates: 192
  elites: 24
  iterations: 3
  init_std: 0.7
  min_std: 0.05
  discount: 0.99
  alpha: 0.2
  execute: elite_mean
rl_residual:
  total_steps: 50000
  random_steps: 3000
  start_steps: 3000
  ramp_steps: 10000
  residual_scale: 0.08
  replay_capacity: 100000
  batch_size: 512
  hidden_dim: 512
  lr: 0.0003
  gamma: 0.99
  tau: 0.005
  init_alpha: 0.1
  target_entropy_scale: 0.3
  consistency_coef: 0.05
  updates_per_step: 4
  safeguard_mode: 'off'
eval:
  episodes: 10
logging:
  root: runs
hardware:
  profile: RTX 5090 32GB
  precision: bf16
  allow_tf32: true
  cudnn_benchmark: true
  matmul_precision: high
  require_cuda: true
