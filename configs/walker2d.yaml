env:
  id: Walker2d-v5
  seed: 0
  success_return_threshold: null
train:
  total_steps: 30000
  warmup_steps: 3000
  wm_update_interval: 250
  wm_updates: 60
  batch_size: 256
  rl_start_steps: 3500
  rl_updates_per_step: 8
  eval_interval: 5000
  checkpoint_interval: 5000
  checkpoint_replay: false
  paired_wm_fraction: 0.65
  wm_freeze_step: 18000
world_model:
  ensemble_size: 5
  hidden_dim: 256
  lr: 0.001
  weight_decay: 1.0e-05
  uncertainty_penalty: 0.2
  stats_momentum: 0.99
  bootstrap_prob: 0.8
  grad_clip: 10.0
mpc:
  horizon: 12
  candidates: 512
  elites: 64
  iterations: 5
  alpha: 0.2
  init_std: 0.6
  min_std: 0.05
  discount: 0.99
  execute: elite_mean
residual:
  chunk_len: 3
  residual_scale: 0.15
  adaptive_gate: true
  gate_threshold: 0.03
  gate_temperature: 0.02
  fixed_gate: 1.0
  consistency_coef: 0.05
  safeguard_mode: 'off'
  safeguard_scales:
  - 1.0
  - 0.5
  - 0.25
  - 0.0
  safeguard_min_improvement: 0.0
  residual_hold_steps: 3
  gate_relative_initial_std: 0.25
sac:
  hidden_dim: 256
  lr: 0.0003
  gamma: 0.99
  tau: 0.005
  init_alpha: 0.2
  target_entropy_scale: 0.3
  critic: dueling
  terminal_value: true
  actor_delay: 2
  target_policy_noise: 0.1
  trust_region_relative: true
logging:
  root: runs
hardware:
  precision: bf16
  allow_tf32: true
  cudnn_benchmark: true
  matmul_precision: high
  require_cuda: true
