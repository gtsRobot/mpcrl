env:
  id: Hopper-v5
  seed: 1
  success_return_threshold: null
train:
  total_steps: 100000
  warmup_steps: 5000
  wm_update_interval: 500
  wm_updates: 40
  batch_size: 1024
  rl_start_steps: 6000
  rl_updates_per_step: 8
  eval_interval: 5000
  final_eval_episodes: 3
  checkpoint_interval: 10000
  checkpoint_replay: false
  paired_wm_fraction: 0.65
  wm_freeze_step: 60000
world_model:
  ensemble_size: 7
  hidden_dim: 512
  lr: 0.001
  weight_decay: 1.0e-05
  uncertainty_penalty: 0.2
  stats_momentum: 0.99
  bootstrap_prob: 0.8
  grad_clip: 10.0
mpc:
  horizon: 15
  candidates: 1024
  elites: 128
  iterations: 5
  alpha: 0.2
  init_std: 0.6
  min_std: 0.05
  discount: 0.99
  execute: elite_mean
residual:
  chunk_len: 3
  residual_scale: 0.1
  adaptive_gate: true
  gate_mode: running_zscore
  gate_momentum: 0.995
  gate_initial_std: -1
  gate_z_threshold: 0.0
  gate_z_temperature: 1.0
  gate_min: 0.15
  gate_max: 0.9
  gate_power: 1.0
  ramp_steps: 5000
  fixed_gate: 1.0
  consistency_coef: 0.03
  temporal_decay: 0.75
  safeguard_mode: 'off'
  safeguard_scales:
  - 1.0
  - 0.5
  - 0.25
  - 0.0
  safeguard_min_improvement: 0.0
  residual_hold_steps: 3
  gate_relative_initial_std: 0.25
sac:
  hidden_dim: 512
  lr: 0.0003
  gamma: 0.99
  tau: 0.005
  init_alpha: 0.2
  target_entropy_scale: 0.3
  critic: dueling
  terminal_value: true
  actor_delay: 2
  target_policy_noise: 0.1
  trust_region_relative: true
logging:
  root: runs
hardware:
  profile: RTX 5090 32GB
  precision: bf16
  allow_tf32: true
  cudnn_benchmark: true
  matmul_precision: high
  require_cuda: true
zprl_style:
  bc_collect_steps: 8000
  bc_epochs: 90
  latent_dim: 16
  base_hidden_dim: 256
  base_eval_episodes: 5
  base_eval_warn_threshold: 140.0
  residual_start_steps: 2000
  residual_ramp_steps: 10000
  residual_scale: 0.035
  consistency_coef: 0.08
  dagger_rounds: 2
  dagger_steps_per_round: 1000
  dagger_refit_epochs: 30
